# Порт должен совпадать с тем, что прописан в frontend/vite.config.js (proxy)
server.port=8080

# --- Подключение к PostgreSQL ---
# Перед первым запуском создай пустую базу (например, через psql):
#   CREATE DATABASE messenger;
# и поправь логин/пароль ниже под свою локальную установку PostgreSQL.
spring.datasource.url=jdbc:postgresql://localhost:5433/messenger
spring.datasource.username=postgres
spring.datasource.password=postgres

# Spring Boot сам прогоняет этот schema.sql при каждом старте — таблицы создаются, если их ещё нет (IF NOT EXISTS),
# отдельный инструмент миграций (Flyway/Liquibase) не подключаем ради простоты.
spring.sql.init.mode=always

logging.level.root=INFO
logging.level.com.messenger=INFO
